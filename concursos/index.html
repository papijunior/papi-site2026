<script>
(function(){
  var feito=false,ir=function(u){if(!feito){feito=true;location.replace(u);}};
  var c=window.AbortController?new AbortController():null;
  setTimeout(function(){if(c)c.abort();ir('abertos/');},3000);
  fetch('https://casa.papijunior.com.br/papi-alertaconcurso/ping.php',{cache:'no-store',signal:c&&c.signal})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){ir(j&&j.ok?'https://casa.papijunior.com.br/concursos/':'abertos/');})
    .catch(function(){ir('abertos/');});
})();
</script>
